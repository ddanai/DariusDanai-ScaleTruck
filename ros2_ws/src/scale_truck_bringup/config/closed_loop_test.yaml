scale_truck_control_node:
  ros__parameters:
    params:
      # Explicitly set to at most 0.2 for a nonzero distance-test command.
      target_vel: 0.0
      target_dist: 0.8
      lv_stop_dist: 0.5
      update_period_s: 0.02
    closed_loop:
      distance_gain: 0.5
      scan_timeout_s: 0.3
      # Sensor-frame angle pointing toward the front of the truck.
      front_center_rad: 0.0
      front_half_width_rad: 0.2617993878

lrc_node:
  ros__parameters:
    params:
      truck_info: 0
    lrc_params:
      update_period_s: 0.02
